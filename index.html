<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portadas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,500;62..125,700;62..125,900&family=Barlow:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="editions" role="group" aria-label="Editorial"></div>
  <main class="workspace">
    <section class="stage" aria-label="Cover preview">
    <section class="panel" aria-label="Datos del libro">
      <form id="form" autocomplete="off">
        <label>
          Author
          <input id="author" name="author" type="text" value="Tolstói" maxlength="80">
        </label>
        <label>
          Title
          <textarea id="title" name="title" rows="2" maxlength="140">La muerte de Iván Ilich. Jadzhí Murat</textarea>
        </label>
        <label>
          Número de páginas
          <input id="pages" name="pages" type="number" inputmode="numeric" min="32" max="1200" step="1" value="320">
          <input id="pages-slider" type="range" min="32" max="1200" step="1" value="320" aria-label="Número de páginas">
        </label>
        <div id="template-options" hidden></div>
        <div id="template-back-options" hidden>
          <label id="template-back-quote-field" hidden>
            Back 1 · Orange quote
            <textarea id="template-back-quote" rows="3" maxlength="500"></textarea>
          </label>
          <label id="template-back-copy-field">
            Back cover text
            <textarea id="template-back-copy" rows="8" maxlength="1800"></textarea>
          </label>
          <label id="author-photo-field" class="file" hidden>
            Author photo for spine and back
            <span class="picker">
              <input id="author-photo" name="author-photo" type="file" accept="image/*">
              <span class="picker-button">Pick Image</span>
              <span id="author-photo-name"></span>
            </span>
          </label>
        </div>
        <div id="debolsillo-options" hidden>
          <fieldset class="choice">
            <legend>Collection</legend>
            <div class="choice-row" id="series">
              <button type="button" class="is-active" data-value="contemporanea" aria-pressed="true">Contemporary</button>
              <button type="button" data-value="clasica" aria-pressed="false">Classic</button>
            </div>
          </fieldset>
          <div class="swatches">
            <div class="swatch-row" data-target="authorColor">
              <span>Author</span>
              <div class="swatch-dots">
                <button type="button" class="is-on" data-color="#111111" aria-label="Negro"></button>
                <button type="button" data-color="#ffffff" aria-label="Blanco"></button>
                <button type="button" data-color="#8a8a8a" aria-label="Gris"></button>
                <button type="button" data-color="#f3e6c8" aria-label="Crema"></button>
                <button type="button" data-color="#e23b4a" aria-label="Rojo"></button>
                <button type="button" data-color="#e87aa0" aria-label="Rosa"></button>
                <button type="button" data-color="#8d2f2f" aria-label="Granate"></button>
                <button type="button" data-color="#e07a2f" aria-label="Naranja"></button>
                <button type="button" data-color="#e4c56a" aria-label="Dorado"></button>
                <button type="button" data-color="#a56b32" aria-label="Ocre"></button>
                <button type="button" data-color="#2f6fad" aria-label="Azul"></button>
                <button type="button" data-color="#1d3c6e" aria-label="Azul oscuro"></button>
                <button type="button" data-color="#3d8c5a" aria-label="Verde"></button>
                <button type="button" data-color="#1f5c45" aria-label="Verde oscuro"></button>
              </div>
            </div>
            <div class="swatch-row" data-target="titleColor">
              <span>Title</span>
              <div class="swatch-dots">
                <button type="button" data-color="#111111" aria-label="Negro"></button>
                <button type="button" data-color="#ffffff" aria-label="Blanco"></button>
                <button type="button" data-color="#8a8a8a" aria-label="Gris"></button>
                <button type="button" data-color="#f3e6c8" aria-label="Crema"></button>
                <button type="button" class="is-on" data-color="#e23b4a" aria-label="Rojo"></button>
                <button type="button" data-color="#e87aa0" aria-label="Rosa"></button>
                <button type="button" data-color="#8d2f2f" aria-label="Granate"></button>
                <button type="button" data-color="#e07a2f" aria-label="Naranja"></button>
                <button type="button" data-color="#e4c56a" aria-label="Dorado"></button>
                <button type="button" data-color="#a56b32" aria-label="Ocre"></button>
                <button type="button" data-color="#2f6fad" aria-label="Azul"></button>
                <button type="button" data-color="#1d3c6e" aria-label="Azul oscuro"></button>
                <button type="button" data-color="#3d8c5a" aria-label="Verde"></button>
                <button type="button" data-color="#1f5c45" aria-label="Verde oscuro"></button>
              </div>
            </div>
          </div>
        </div>
        <div id="penguin-options" hidden>
          <label>
            Back 1 · Orange quote
            <textarea id="back-quote" rows="3" maxlength="500">'Behold Oroonoko, the most wretched, and abandoned by fortune of all the creation of the gods'</textarea>
          </label>
          <label>
            Back 2 · Main text
            <textarea id="back-copy" rows="9" maxlength="1800">Aphra Behn’s short novel Oroonoko tells the story of a noble African prince who is betrayed and sold into slavery. Using the author’s own experiences in Surinam, it depicts the tragedy of a man born to command brought to a position of abject powerlessness. Behn’s bawdy Restoration drama The Rover centres on the dissolute Cavalier Willmore, a follower of the exiled Charles II, and the attempts of two spirited women — Angellica Bianca, a courtesan, and Hellena, a cross-dressing virgin — to woo him. The other works collected here include poems, letters, prose and the play The Widow Ranter, the first drama to be set in the American colonies. Together they demonstrate the versatility and sophistication of one of the most innovative and wide-ranging authors of the seventeenth century.

In her introduction, Janet Todd explores the social changes that have influenced Aphra Behn’s reputation over the centuries. This edition also contains notes on all the texts.

‘All women together ought to let flowers fall upon the tomb of Aphra Behn, for it was she who earned them the right to speak their minds’ VIRGINIA WOOLF

Edited with an introduction and notes by JANET TODD</textarea>
          </label>
        </div>
        <label class="file">
          Cover Image
          <span class="picker">
            <input id="photo" name="photo" type="file" accept="image/*">
            <span class="picker-button">Pick Image</span>
            <span id="photo-name"></span>
          </span>
        </label>
        <label>
          Cover Image Zoom
          <input id="zoom" type="range" min="1" max="2.4" step="0.01" value="1" disabled>
        </label>
        <label>
          Image position · horizontal
          <input id="pan-x" type="range" min="-100" max="100" step="1" value="0" disabled>
        </label>
        <label>
          Image position · vertical
          <input id="pan-y" type="range" min="-100" max="100" step="1" value="0" disabled>
        </label>
        <button type="button" id="reset" class="text-action">Reset framing</button>
        <p class="hint">Use the position sliders to frame the cover image.</p>
        <p id="font-note" class="font-note" hidden>
          This cover uses Trade Gothic. Install Trade Gothic Regular and Trade Gothic Bold,
          or leave those two files in the fonts folder.
        </p>
      </form>
      <div class="panel-actions">
        <div class="actions">
          <button type="button" id="download">Download PNG</button>
          <button type="button" id="preview" aria-pressed="false">View in 3D</button>
        </div>
      </div>
    </section>

      <div id="surface-preview">
        <div id="preview-switcher" class="choice-row" role="group" aria-label="Cara del libro">
          <button type="button" class="is-active" data-surface="front" aria-pressed="true">Front</button>
          <button type="button" data-surface="spine" aria-pressed="false">Spine</button>
          <button type="button" data-surface="back" aria-pressed="false">Back</button>
        </div>
        <canvas id="cover" width="1600" height="2400">Portada</canvas>
        <canvas id="spine-preview" aria-label="Lomo" hidden></canvas>
        <canvas id="back-preview" aria-label="Contraportada" hidden></canvas>
      </div>
      <div id="book-view" hidden>
        <button type="button" id="reset-rotation">Reset rotation</button>
        <div id="book-controls">
          <label class="book-control" for="pages-3d-slider">
            <span>Page count</span>
            <input id="pages-3d-slider" type="range" min="32" max="1200" step="1" value="320" aria-label="Número de páginas">
            <output id="pages-3d-value" for="pages-3d-slider">320</output>
          </label>
          <label class="book-control" for="wear-slider">
            <span>Book wear</span>
            <input id="wear-slider" type="range" min="0" max="100" step="1" value="0" aria-label="Book wear">
            <output id="wear-value" for="wear-slider">0%</output>
          </label>
        </div>
      </div>
      <div class="stage-balance" aria-hidden="true"></div>
      <p class="caption">Alianza Editorial · 120 × 180 mm · 320 páginas</p>
    </section>
  </main>
  <button type="button" id="edit-cover" hidden>Edit Cover</button>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="app.js?v=book-wear-16"></script>
</body>
</html>
